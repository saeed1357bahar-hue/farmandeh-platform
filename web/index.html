<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farmandeh Studio</title>
<style>
body{font-family:sans-serif;background:#111318;color:#eee;margin:0}
header{padding:18px 20px;border-bottom:1px solid #2a2d35;position:sticky;top:0;background:#111318}
main{padding:20px;display:grid;gap:14px}
.card{background:#191c23;border:1px solid #2a2d35;border-radius:16px;padding:18px}
button{padding:10px 14px;border-radius:10px;border:0;margin:4px}
small{color:#aaa}
</style>
</head>
<body>
<header><b>Farmandeh Studio v0.2</b><br><small>Foundation Shell</small></header>
<main>
<div class="card"><h3>Page Builder</h3><p>ساخت و ویرایش صفحات</p><button>Open</button></div>
<div class="card"><h3>Data Engine</h3><p>تعریف موجودیت، فیلد و ارتباط</p><button>Open</button></div>
<div class="card"><h3>Modules</h3><p>فعال/غیرفعال و تنظیم ماژول‌ها</p><button>Open</button></div>
<div class="card"><h3>Theme Engine</h3><p>رنگ، فونت، فاصله، Radius و Motion</p><button>Open</button></div>
<div class="card"><h3>Automation</h3><p>Trigger / Condition / Action</p><button>Open</button></div>
<div class="card"><h3>Templates</h3><p>Clone برای شغل‌های مختلف</p><button>Open</button></div>
</main>
</body>
</html>
